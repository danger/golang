name: "Danger Go"
on: [pull_request]
jobs:
  danger:
    name: Danger Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '^1.24'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Danger JS
        run: npm install -g danger@14.1.0

      - name: Install danger-go
        run: go install github.com/danger/golang/cmd/danger-go

      - name: Check versions
        run: |
          go version
          danger-go version
          danger -V

      - name: Run danger-go ci
        run: danger-go ci
        working-directory: ./build/ci

      - name: Run danger-go pr
        run: danger-go pr "$PR_URL"
        working-directory: ./build/ci
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '^1.24'

      - name: Go tests
        run: go test -v ./...
